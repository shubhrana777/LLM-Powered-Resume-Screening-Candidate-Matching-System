[pytest]
testpaths = tests
markers =
    model: needs the real Sentence Transformers model (downloads on first run; skipped if unavailable)
filterwarnings =
    # faiss-cpu's SWIG bindings emit these on import; not actionable from here.
    ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
